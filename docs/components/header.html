<!-- components/header.html -->
<header class="site-header" id="top">
  <div class="container header-row">
    <div class="brand">
      <div class="brand-trigger">
        <svg
          class="brand-mark"
          viewBox="0 0 60 60"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <!-- Outer circle outline -->
          <circle
            cx="30"
            cy="30"
            r="27"
            stroke="currentColor"
            stroke-width="1.5"
            fill="none"
            opacity="0.3"
          />

          <!-- Inner circle with grey fill -->
          <circle cx="30" cy="30" r="24" fill="currentColor" opacity="0.08" />

          <!-- Text centered with tighter spacing -->
          <text
            x="30"
            y="38"
            text-anchor="middle"
            font-family="'Cairo Play', sans-serif"
            font-size="20"
            font-weight="800"
            letter-spacing="-1"
            fill="currentColor"
          >
            d:p
          </text>
        </svg>

        <div>
          <div class="brand-title">Daniela Penati</div>
          <div class="brand-subtitle">UX Design & Leadership</div>
        </div>
      </div>

      <!-- Login dropdown menu -->
      <div class="login-dropdown" id="loginDropdown">
        <form class="login-form" id="loginForm">
          <input
            type="password"
            id="passwordInput"
            class="login-input"
            placeholder="Enter password"
            aria-label="Password"
            required
          />
          <button type="submit" class="login-button">Login</button>
        </form>
        <div class="login-error" id="loginError" style="display: none">
          Incorrect password. Please try again.
        </div>
      </div>
    </div>

    <div class="header-actions">
      <nav class="nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
        data-theme-toggle
      >
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
