<style>
  /* -------------------------
   Sticky header
-------------------------- */

  .site-header a {
    color: inherit;
    text-decoration: none;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 9999;
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }

  .header-row {
    display: flex;
    /* align-items: center; */
    justify-content: space-between;
    gap: 16px;
    padding: 14px var(--pad-x);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }

  .brand-trigger {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }

  /* Login dropdown */
  .login-dropdown {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    z-index: 10000;
    min-width: 280px;
  }

  .brand:hover .login-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .login-dropdown.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .login-form {
    display: flex;
    gap: 8px;
  }

  .login-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    outline: none;
    transition: border-color 220ms ease;
  }

  .login-input:focus {
    border-color: var(--accent);
  }

  .login-button {
    padding: 10px 20px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 220ms ease;
  }

  .login-button:hover {
    background: color-mix(in srgb, var(--accent) 85%, #000);
    transform: translateY(-1px);
  }

  .login-error {
    margin-top: 8px;
    padding: 8px;
    background: rgba(220, 53, 69, 0.1);
    border: 1px solid rgba(220, 53, 69, 0.3);
    border-radius: 6px;
    font-size: 12px;
    color: #dc3545;
  }

  /* Mobile: Click to toggle */
  @media (max-width: 768px) {
    .brand:hover .login-dropdown {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
    }

    .brand-trigger {
      -webkit-tap-highlight-color: transparent;
    }
  }

  .brand-mark {
    width: 48px;
    height: 48px;
    color: var(--ink);
    flex-shrink: 0;
  }

  .brand-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    line-height: 1.2;
    letter-spacing: 0.01em;
  }

  .brand-subtitle {
    margin-top: 2px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--muted);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .nav {
    display: flex;
    gap: 20px;
  }

  .nav a {
    position: relative;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: var(--muted);
    transition: color 220ms ease;
  }

  .nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0%;
    height: 1px;
    background: var(--accent);
    transition: width 200ms ease;
  }

  .nav a:hover {
    color: var(--ink);
  }

  .nav a:hover::after {
    width: 100%;
  }

  .theme-toggle {
    width: 36px;
    height: 36px;
    display: inline-grid;
    place-items: center;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 220ms ease;
  }

  .theme-toggle:hover {
    border-color: var(--accent-muted);
    background: var(--accent-soft);
  }

  .theme-icon {
    font-size: 16px;
    line-height: 1;
  }
</style>
<!-- components/header.html -->
<header class="site-header" id="top">
  <div class="container header-row">
    <div class="brand">
      <a
        href="https://dpenati.github.io/portfolio/index.html"
        class="brand-link"
      >
        <div class="brand-trigger">
          <svg
            class="brand-mark"
            viewBox="0 0 60 60"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <!-- Outer circle outline -->
            <circle
              cx="30"
              cy="30"
              r="27"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
              opacity="0.3"
            />

            <!-- Inner circle with grey fill -->
            <circle cx="30" cy="30" r="24" fill="currentColor" opacity="0.08" />

            <!-- Text centered with tighter spacing -->
            <text
              x="30"
              y="38"
              text-anchor="middle"
              font-family="'Cairo Play', sans-serif"
              font-size="20"
              font-weight="800"
              letter-spacing="-1"
              fill="currentColor"
            >
              d:p
            </text>
          </svg>

          <div>
            <div class="brand-title">Daniela Penati</div>
            <div class="brand-subtitle">UX Design & Leadership</div>
          </div>
        </div>
      </a>

      <!-- Login dropdown menu -->
      <div class="login-dropdown" id="loginDropdown">
        <form class="login-form" id="loginForm">
          <input
            type="password"
            id="passwordInput"
            class="login-input"
            placeholder="Enter password"
            aria-label="Password"
            required
          />
          <button type="submit" class="login-button">Login</button>
        </form>
        <div class="login-error" id="loginError" style="display: none">
          Incorrect password. Please try again.
        </div>
      </div>
    </div>

    <div class="header-actions">
      <nav class="nav" aria-label="Primary">
        <a href="https://dpenati.github.io/portfolio/index.html#about">About</a>
        <a href="https://dpenati.github.io/portfolio/index.html#work">Work</a>
        <a href="https://dpenati.github.io/portfolio/index.html#contact"
          >Contact</a
        >
      </nav>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
        data-theme-toggle
      >
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
<script>
  // --- Theme handling ---
  const KEY = 'dp-theme';

  function applyTheme(mode) {
    root.setAttribute('data-theme', mode);

    if (mode === 'dark') root.style.colorScheme = 'dark';
    else if (mode === 'light') root.style.colorScheme = 'light';
    else root.style.colorScheme = 'light dark';
  }

  function getStoredTheme() {
    try {
      return localStorage.getItem(KEY);
    } catch {
      return null;
    }
  }

  function setStoredTheme(mode) {
    try {
      localStorage.setItem(KEY, mode);
    } catch {}
  }

  function initTheme() {
    const stored = getStoredTheme();
    const mode = stored || root.getAttribute('data-theme') || 'auto';
    applyTheme(mode);
  }

  function bindThemeToggle() {
    const btn =
      document.querySelector('[data-theme-toggle]') ||
      document.getElementById('themeToggle');

    if (!btn) return;

    btn.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') || 'auto';
      const next =
        current === 'auto' ? 'dark' : current === 'dark' ? 'light' : 'auto';
      applyTheme(next);
      setStoredTheme(next);

      btn.setAttribute('aria-label', `Theme: ${next}`);
    });
  }

  initTheme();
  bindThemeToggle();
</script>
