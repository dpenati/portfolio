<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Private — Daniela Penati</title>
    <meta name="color-scheme" content="light dark" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo+Play:wght@400;600;700;800&family=Caveat:wght@400;700&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Condensed:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />

    <style>
      /* ----------------------------------------
         Login page overrides & form styles
      ---------------------------------------- */

      /* Hero subtitle — calligraphy quote */
      .hero-subtitle-quote {
        position: absolute;
        top: calc(100px + clamp(52px, 9vw, 110px) + 12px);
        left: var(--pad-x);
        font-family: 'Caveat', cursive;
        font-weight: 400;
        font-size: clamp(20px, 3vw, 32px);
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.02em;
        font-style: italic;
        z-index: 2;
        margin: 0;
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .hero-subtitle-quote {
          top: calc(130px + clamp(40px, 12vw, 70px) + 10px);
          font-size: clamp(16px, 4vw, 24px);
          white-space: normal;
          max-width: 90vw;
        }
      }

      /* ----------------------------------------
         Login form area — sits on the grey strip
      ---------------------------------------- */

      .auth-section {
        position: relative;
        z-index: 100;
        background: rgba(60, 60, 60, 0.95);
        backdrop-filter: blur(12px);
        padding: clamp(48px, 8vh, 80px) 0 clamp(56px, 9vh, 90px);
      }

      html[data-theme='dark'] .auth-section,
      html[data-theme='auto'] .auth-section {
        background: rgba(30, 30, 30, 0.95);
      }

      @media (prefers-color-scheme: dark) {
        html[data-theme='auto'] .auth-section {
          background: rgba(30, 30, 30, 0.95);
        }
      }

      .auth-inner {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 var(--pad-x);
      }

      /* Form heading */
      .auth-heading {
        font-family: 'Cairo Play', var(--serif);
        font-weight: 600;
        font-size: clamp(28px, 4vw, 38px);
        color: #ffffff;
        margin: 0 0 8px 0;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .auth-subheading {
        font-family: var(--condensed);
        font-weight: 300;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.55);
        margin: 0 0 44px 0;
        line-height: 1.5;
      }

      /* Form fields */
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 36px;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
      }

      .auth-label {
        font-family: var(--sans);
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        transition: color 0.25s ease;
      }

      .auth-field:focus-within .auth-label {
        color: rgba(110, 91, 152, 0.9);
      }

      .auth-input {
        width: 100%;
        padding: 18px 0 16px;
        border: none;
        border-bottom: 1.5px solid rgba(255, 255, 255, 0.18);
        background: transparent;
        font-family: var(--sans);
        font-size: clamp(18px, 2.5vw, 22px);
        font-weight: 300;
        color: #ffffff;
        outline: none;
        transition: border-color 0.3s ease;
        border-radius: 0;
        /* override global input styles */
        -webkit-appearance: none;
      }

      .auth-input::placeholder {
        color: rgba(255, 255, 255, 0.2);
        font-weight: 300;
      }

      .auth-input:focus {
        border-bottom-color: var(--accent);
      }

      /* Animated underline glow */
      .auth-field::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 1.5px;
        background: var(--accent);
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .auth-field:focus-within::after {
        width: 100%;
      }

      /* Submit button */
      .auth-submit-wrap {
        margin-top: 12px;
      }

      .auth-btn {
        width: 100%;
        padding: 22px 40px;
        background: transparent;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        font-family: 'Cairo Play', var(--sans);
        font-size: clamp(16px, 2vw, 19px);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #ffffff;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .auth-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 0;
      }

      .auth-btn:hover::before {
        transform: scaleX(1);
      }

      .auth-btn:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(110, 91, 152, 0.35);
      }

      .auth-btn:active {
        transform: translateY(0);
      }

      .auth-btn span {
        position: relative;
        z-index: 1;
      }

      /* Error message */
      #msg:not(:empty) {
        margin-top: 20px;
        padding: 14px 18px;
        background: rgba(220, 53, 69, 0.12);
        border: 1px solid rgba(220, 53, 69, 0.3);
        border-radius: 8px;
        font-family: var(--sans);
        font-size: 14px;
        color: rgba(255, 130, 130, 0.9);
        line-height: 1.5;
      }

      /* Purple reveal below (matching indexDP pattern) */
      .auth-purple-reveal {
        width: 100%;
        min-height: 30vh;
        background: linear-gradient(135deg, #6e5b98 0%, #8b7ba8 100%);
        position: relative;
        z-index: 100;
      }

      html[data-theme='dark'] .auth-purple-reveal,
      html[data-theme='auto'] .auth-purple-reveal {
        background: linear-gradient(135deg, #5a4a7a 0%, #6e5b98 100%);
      }

      @media (prefers-color-scheme: dark) {
        html[data-theme='auto'] .auth-purple-reveal {
          background: linear-gradient(135deg, #5a4a7a 0%, #6e5b98 100%);
        }
      }

      /* Autofill style fix */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #ffffff;
        -webkit-box-shadow: 0 0 0px 1000px transparent inset;
        transition: background-color 5000s ease-in-out 0s;
        caret-color: white;
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Sticky header -->
    <header class="site-header" id="top">
      <div class="container header-row">
        <div class="brand">
          <a href="../index.html" class="brand-link">
            <svg
              class="brand-mark"
              viewBox="0 0 60 60"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <circle
                cx="30"
                cy="30"
                r="27"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
                opacity="0.3"
              />
              <circle
                cx="30"
                cy="30"
                r="24"
                fill="currentColor"
                opacity="0.08"
              />
              <text
                x="30"
                y="38"
                text-anchor="middle"
                font-family="'Cairo Play', sans-serif"
                font-size="20"
                font-weight="800"
                letter-spacing="-1"
                fill="currentColor"
              >
                d:p
              </text>
            </svg>
            <div>
              <div class="brand-title">Daniela Penati</div>
              <div class="brand-subtitle">UX Design & Leadership</div>
            </div>
          </a>
        </div>

        <div class="header-actions">
          <nav class="nav" aria-label="Primary">
            <a href="../daniela/indexDP.html">About</a>
            <a href="../work/indexWK.html">Work</a>
            <a href="../index.html#contact">Contact</a>
          </nav>

          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
            aria-pressed="false"
            data-theme-toggle
          >
            <span class="theme-icon" aria-hidden="true">◐</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- Purple parallax hero (matching indexDP) -->
      <div class="hero-parallax-container">
        <div class="hero-parallax-fixed">
          <div class="hero-title-corner">Private</div>
          <p class="hero-subtitle-quote">Qui si entra, ma non si esce</p>
        </div>
      </div>

      <!-- Grey login section -->
      <section class="auth-section" aria-label="Login">
        <div class="auth-inner">
          <h1 class="auth-heading">Members only</h1>
          <p class="auth-subheading">
            Enter your credentials to access protected work.
          </p>

          <form id="loginForm" class="auth-form" novalidate>
            <div class="auth-field">
              <label class="auth-label" for="email">Email</label>
              <input
                class="auth-input"
                id="email"
                type="email"
                placeholder="your@email.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="auth-field">
              <label class="auth-label" for="password">Password</label>
              <input
                class="auth-input"
                id="password"
                type="password"
                placeholder="••••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <div class="auth-submit-wrap">
              <button type="submit" class="auth-btn">
                <span>Come in</span>
              </button>
            </div>

            <p id="msg" role="alert" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <!-- Purple reveal base -->
      <div class="auth-purple-reveal" aria-hidden="true"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container footer-row">
        <div>
          <div class="footer-meta">
            <a
              class="social-icon"
              href="https://www.linkedin.com/in/danielapenati/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4V9h4v2"
                />
                <path d="M2 9h4v12H2z" />
                <path d="M4 4a2 2 0 1 0 0 .001z" />
              </svg>
            </a>
            <a
              class="social-icon"
              href="mailto:daniela@dpenati.com"
              aria-label="Email"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M4 4h16v16H4z" />
                <path d="m4 6 8 6 8-6" />
              </svg>
            </a>
            <span class="footer-copy">
              © <span data-year>2026</span> Daniela Penati
            </span>
          </div>
        </div>
      </div>
    </footer>

    <a class="fab-top" href="#top" aria-label="Back to top">
      <span aria-hidden="true">↑</span>
    </a>

    <!-- Theme script (inline, no external dependency) -->
    <script>
      (function () {
        const root = document.documentElement;
        const KEY = 'dp-theme';

        function applyTheme(mode) {
          root.setAttribute('data-theme', mode);
          root.style.colorScheme =
            mode === 'dark'
              ? 'dark'
              : mode === 'light'
                ? 'light'
                : 'light dark';
        }

        function initTheme() {
          try {
            const stored = localStorage.getItem(KEY);
            applyTheme(stored || root.getAttribute('data-theme') || 'auto');
          } catch {
            applyTheme('auto');
          }
        }

        function bindToggle() {
          const btn = document.querySelector('[data-theme-toggle]');
          if (!btn) return;
          btn.addEventListener('click', () => {
            const cur = root.getAttribute('data-theme') || 'auto';
            const next =
              cur === 'auto' ? 'dark' : cur === 'dark' ? 'light' : 'auto';
            applyTheme(next);
            try {
              localStorage.setItem(KEY, next);
            } catch {}
            btn.setAttribute('aria-label', `Theme: ${next}`);
          });
        }

        // Footer year
        document.querySelectorAll('[data-year]').forEach((el) => {
          el.textContent = new Date().getFullYear();
        });

        // Back to top
        const fab = document.querySelector('.fab-top');
        if (fab) {
          fab.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        initTheme();
        bindToggle();
      })();
    </script>

    <!-- Auth module -->
    <script type="module" src="./auth-login.js"></script>
  </body>
</html>
