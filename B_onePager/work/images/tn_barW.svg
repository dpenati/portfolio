<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f7"></stop>
      <stop offset="1" stop-color="#e9e9e9"></stop>
    </linearGradient>

    <!-- Blueprint grid -->
    <pattern id="gridSmall" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#cfcfcf" stroke-width="1" opacity="0.45"></path>
    </pattern>
    <pattern id="gridBig" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="url(#gridSmall)"></rect>
      <path d="M90 0H0V90" fill="none" stroke="#bdbdbd" stroke-width="1.5" opacity="0.55"></path>
    </pattern>

    <!-- Gentle grain -->
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.55
        0 0 0 0 0.55
        0 0 0 0 0.55
        0 0 0 0.09 0"></feColorMatrix>
    </filter>

    <style>
      .ink { stroke:#1d1d1d; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .box { stroke:#1d1d1d; stroke-width:8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .muted { stroke:#6c6c6c; stroke-width:1.5; fill:none; opacity:0.85; }
      .dim { stroke:#6c6c6c; stroke-width:1.5; fill:none; opacity:0.55; stroke-dasharray:4 7; }
      .txt { fill:#2a2a2a; font-family: Inter, Arial, sans-serif; font-size:16px; opacity:0.9; }
      .tiny { fill:#5a5a5a; font-family: Inter, Arial, sans-serif; font-size:12px; opacity:0.85; }
      .label { fill:#1d1d1d; font-family: Inter, Arial, sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bg)"></rect>
  <rect width="1200" height="640" fill="url(#gridBig)" opacity="0.9"></rect>
  <rect width="1200" height="640" filter="url(#grain)" opacity="0.20"></rect>

  <!-- Frame (tight + consistent margins) -->
  <rect
    x="60"
    y="40"
    width="1100"
    height="560"
    fill="none"
    stroke="#C0C0C0"
    stroke-width="12"
    opacity="0.8"
  ></rect>

  <!-- Blueprint diagram: pipeline + rituals -->
  <g transform="translate(90 120)">
    <!-- Nodes -->
    <rect x="0" y="60" width="220" height="120" rx="14" class="box" opacity="0.95"></rect>
    <rect x="270" y="60" width="220" height="120" rx="14" class="box" opacity="0.75"></rect>
    <rect x="540" y="60" width="220" height="120" rx="14" class="box" opacity="0.75"></rect>
    <rect x="810" y="60" width="220" height="120" rx="14" class="box" opacity="0.75"></rect>

    <!-- Connectors -->
    <path d="M220 120H270" class="muted"></path>
    <path d="M490 120H540" class="muted"></path>
    <path d="M760 120H810" class="muted"></path>

    <!-- Arrowheads -->
    <path d="M262 112l10 8-10 8" class="muted"></path>
    <path d="M532 112l10 8-10 8" class="muted"></path>
    <path d="M802 112l10 8-10 8" class="muted"></path>

    <!-- Titles in boxes -->
    <text x="22" y="105" class="label">Build</text>
    <text x="292" y="105" class="label">Test</text>
    <text x="562" y="105" class="label">Deploy</text>
    <text x="832" y="105" class="label">Observe</text>

    <!-- Sub-lines -->
    <path d="M22 132H180" class="dim"></path>
    <path d="M22 152H150" class="dim"></path>
    <path d="M292 132H450" class="dim"></path>
    <path d="M292 152H420" class="dim"></path>
    <path d="M562 132H720" class="dim"></path>
    <path d="M562 152H690" class="dim"></path>
    <path d="M832 132H990" class="dim"></path>
    <path d="M832 152H960" class="dim"></path>

    <!-- Status legend -->
    <g transform="translate(670 330)" opacity="0.9">
      <rect x="0" y="0" width="360" height="86" rx="14" fill="#ffffff" opacity="0.55"/>
      <rect x="0" y="0" width="360" height="86" rx="14" fill="none" stroke="#1d1d1d" stroke-width="2" opacity="0.18"/>

      <text x="16" y="28"
            fill="#1d1d1d" font-family="Inter, Arial, sans-serif"
            font-size="12" letter-spacing="0.12em" opacity="0.75">
        STATUS LEGEND
      </text>

      <circle cx="24" cy="56" r="6" fill="#1d1d1d" opacity="0.85"/>
      <text x="40" y="60" fill="#2a2a2a" font-family="Inter, Arial, sans-serif" font-size="14" opacity="0.85">
        needs attention
      </text>

      <circle cx="190" cy="56" r="6" fill="#1d1d1d" opacity="0.35"/>
      <text x="206" y="60" fill="#2a2a2a" font-family="Inter, Arial, sans-serif" font-size="14" opacity="0.65">
        stable
      </text>
    </g>

    <!-- Ritual cadence line -->
    <path d="M0 245H1030" class="dim"></path>
    <circle cx="110" cy="245" r="6" fill="#1d1d1d" opacity="0.95"></circle>
    <circle cx="310" cy="245" r="6" fill="#1d1d1d" opacity="0.95"></circle>
    <circle cx="510" cy="245" r="6" fill="#1d1d1d" opacity="0.95"></circle>
    <circle cx="710" cy="245" r="6" fill="#1d1d1d" opacity="0.95"></circle>
    <circle cx="910" cy="245" r="6" fill="#1d1d1d" opacity="0.95"></circle>

    <text x="0" y="372" class="txt">Rituals → alignment → reliable delivery</text>
    <text x="0" y="400" class="tiny">Operating model • clarity of ownership • signal over noise</text>
  </g>
</svg>
