<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f7f7"></stop>
      <stop offset="1" stop-color="#e8e8e8"></stop>
    </linearGradient>

    <!-- Blueprint grid -->
    <pattern id="gridSmall2" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#cfcfcf" stroke-width="1" opacity="0.45"></path>
    </pattern>
    <pattern id="gridBig2" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="url(#gridSmall2)"></rect>
      <path d="M90 0H0V90" fill="none" stroke="#bdbdbd" stroke-width="1.5" opacity="0.55"></path>
    </pattern>

    <!-- Gentle grain -->
    <filter id="grain2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.55
        0 0 0 0 0.55
        0 0 0 0 0.55
        0 0 0 0.09 0"></feColorMatrix>
    </filter>

    <!-- Soft shadow for title plate -->
    <filter id="plateShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.10"></feDropShadow>
    </filter>

    <style>
      .ink { stroke:#1d1d1d; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .box { stroke:#1d1d1d; stroke-width:8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .muted { stroke:#6c6c6c; stroke-width:1.5; fill:none; opacity:0.85; }
      .dim { stroke:#6c6c6c; stroke-width:1.5; fill:none; opacity:0.55; stroke-dasharray:4 7; }
      .txt { fill:#2a2a2a; font-family: Inter, Arial, sans-serif; font-size:16px; opacity:0.9; }
      .tiny { fill:#5a5a5a; font-family: Inter, Arial, sans-serif; font-size:12px; opacity:0.85; }
      .serif { fill:#1a1a1a; font-family: Georgia, serif; font-size:44px; }
      .label { fill:#1d1d1d; font-family: Inter, Arial, sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; }
      .stampText { fill:#1d1d1d; font-family: Inter, Arial, sans-serif; font-size:16px; letter-spacing:0.14em; text-transform:uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg2)"></rect>
  <rect width="1200" height="900" fill="url(#gridBig2)" opacity="0.9"></rect>
  <rect width="1200" height="900" filter="url(#grain2)" opacity="0.20"></rect>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#C0C0C0" stroke-width="12" opacity="0.8"></rect>

  <!-- Blueprint diagram: IDE + plugin hint -->
  <g transform="translate(110 125)">
    <!-- IDE frame -->
    <rect x="0" y="0" width="980" height="430" rx="16" class="box" opacity="0.85"></rect>

    <!-- top bar separator -->
    <path d="M0 58H980" class="muted" opacity="0.7"></path>

    <!-- window dots -->
    <circle cx="34" cy="30" r="7" fill="#1d1d1d" opacity="0.45"></circle>
    <circle cx="58" cy="30" r="7" fill="#1d1d1d" opacity="0.30"></circle>
    <circle cx="82" cy="30" r="7" fill="#1d1d1d" opacity="0.20"></circle>

    <!-- Sidebar + editor panels -->
    <rect x="18" y="78" width="210" height="332" rx="12" class="box" opacity="0.55"></rect>
    <rect x="248" y="78" width="712" height="332" rx="12" class="box" opacity="0.35"></rect>

    <!-- Sidebar lines -->
    <path d="M38 112H210" class="dim"></path>
    <path d="M38 140H190" class="dim"></path>
    <path d="M38 168H200" class="dim"></path>
    <path d="M38 196H180" class="dim"></path>
    <path d="M38 224H205" class="dim"></path>

    <!-- Code lines -->
    <path d="M275 120H920" class="dim"></path>
    <path d="M275 148H860" class="dim"></path>
    <path d="M275 176H900" class="dim"></path>
    <path d="M275 204H820" class="dim"></path>
    <path d="M275 232H910" class="dim"></path>
    <path d="M275 260H780" class="dim"></path>

    <!-- Plugin hint bubble -->
    <rect x="610" y="170" width="310" height="120" rx="14" class="ink" opacity="0.95"></rect>
    <path d="M610 210H575" class="ink" opacity="0.95"></path>
    <path d="M575 210l18-14v28z" fill="#f7f7f7" stroke="#1d1d1d" stroke-width="4"></path>

    <text x="635" y="210" class="label">Smart Code</text>
    <text x="635" y="242" class="tiny">Suggestion • context • next step</text>
    <text x="635" y="270" class="tiny">Less friction, more signal</text>


    <!-- Flow line below -->
    <path d="M40 470H1040" class="dim"></path>
    <circle cx="220" cy="470" r="6" fill="#1d1d1d" opacity="0.55"></circle>
    <circle cx="520" cy="470" r="6" fill="#1d1d1d" opacity="0.55"></circle>
    <circle cx="820" cy="470" r="6" fill="#1d1d1d" opacity="0.55"></circle>

  </g>

  <!-- Title plate -->
  <g filter="url(#plateShadow2)">
    <rect x="70" y="650" width="1060" height="170" fill="#ffffff" opacity="0.78"></rect>
  </g>

  <text x="95" y="718" class="serif">Smart Code Plugin</text>
  <text x="95" y="770" class="txt" fill="#5a5a5a" opacity="0.9">
    From idea to adoption — clarifying needs, alignment, and rollout
  </text>

  <!-- Corner stamp -->
  <g transform="translate(900 55)">
    <rect x="0" y="0" width="200" height="48" rx="14" fill="#ffffff" opacity="0.65"></rect>
    <rect x="0" y="0" width="200" height="48" rx="14" fill="none" stroke="#1d1d1d" stroke-width="2" opacity="0.55"></rect>
    <text x="30" y="31" class="stampText" opacity="0.85">COMING SOON</text>
  </g>
</svg>
